apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hospital
  template:
    metadata:
      labels:
        app: hospital
    spec:
      containers:
        - name: hospital
          # >>> REPLACE with YOUR Docker Hub image (Phase 4) <<<
          image: harsh0soni/hospital:v1.0.0
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: hospital-configmap
            - secretRef:
                name: hospital-secret
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-service
spec:
  type: LoadBalancer
  selector:
    app: hospital
  ports:
    - port: 80
      targetPort: 5000