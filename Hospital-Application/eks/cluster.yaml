apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: hospital-eks
  region: eu-west-1
  version: "1.30"
availabilityZones:
  - eu-west-1a
  - eu-west-1b
iam:
  withOIDC: true
managedNodeGroups:
  - name: ng-workers
    instanceType: t3.small
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 30
    iam:
      withAddonPolicies:
        ebs: true
addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true